<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Manjericão Produtos Naturais</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/logo-perfil.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5EF; --card:#FFFFFF; --tx:#1F2A17; --tx2:#3F4A37; --line:#D9D4C4;
  --verde:#5E8A2E; --verde2:#2F4A1C; --verdeBg:#EAF2DC; --marrom:#5A3B26; --marromBg:#F3EADF;
  --ouro:#9A6B12; --ouroBg:#FDF1D8; --red:#B42318; --redBg:#FDE7E5; --blue:#1E5A96; --blueBg:#E2EEF9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0;line-height:1.25;color:var(--verde2)}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde2)}
.muted{color:var(--tx2)}
.small{font-size:15px}

/* ---------- botões / campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:10px;border:2px solid var(--verde2);background:#fff;color:var(--verde2);font-weight:700;cursor:pointer;text-decoration:none;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--verdeBg)}
.btn.pri{background:var(--verde2);color:#fff}
.btn.pri:hover{background:#22370F}
.btn.wa{background:#167A3A;border-color:#167A3A;color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.pri{background:var(--red);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible{outline:3px solid #C9973A;outline-offset:2px}
label.f{display:block;font-weight:700;font-size:15px;margin-bottom:12px}
label.f span{display:block;margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:2px solid #B9B3A0;border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--verde2)}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--verde2)}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-box{width:100%;max-width:420px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(47,74,28,.08)}
.login-box img{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 12px;border:3px solid var(--verdeBg)}
.login-box h1{text-align:center;font-size:23px}
.login-box p.sub{text-align:center;margin:4px 0 20px;color:var(--tx2)}
.demo-hint{background:var(--ouroBg);border:2px solid #E7C982;color:#5C3E05;border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:16px}

/* ---------- layout ---------- */
#app{display:none}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--verde2);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:12px}
.brand img{width:46px;height:46px;border-radius:50%;border:2px solid #fff}
.brand b{font-family:Poppins;font-size:17px;display:block;line-height:1.15}
.brand small{font-size:13px;opacity:.9}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#fff;text-decoration:none;font-weight:600;font-size:16px;margin-bottom:3px}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.on{background:#fff;color:var(--verde2)}
.nav a .ic{width:24px;text-align:center;font-size:18px}
.nav a .bdg{margin-left:auto;background:#C9973A;color:#fff;border-radius:99px;font-size:13px;padding:1px 8px;font-weight:800}
.nav a.on .bdg{background:var(--verde2)}
.side .sair{margin-top:auto;padding-top:12px}
.side .sair .btn{width:100%;background:transparent;border-color:#fff;color:#fff}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.96);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px}
.top h1{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selo{background:var(--ouroBg);color:#5C3E05;border:2px solid #E7C982;font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px;white-space:nowrap}
.bell{position:relative;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-style:normal;font-size:13px;font-weight:800;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}
.hamb{display:none}
.content{padding:22px 24px 40px;max-width:1400px}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.card + .card{margin-top:16px}
.grid>.card{margin:0}
.card h2{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;border-left:8px solid var(--verde)}
.kpi .l{font-size:15px;font-weight:700;color:var(--tx2)}
.kpi .v{font-family:Poppins;font-size:28px;font-weight:800;color:var(--verde2);line-height:1.2;margin-top:4px}
.kpi .s{font-size:14px;color:var(--tx2)}
.kpi.ouro{border-left-color:#C9973A}.kpi.marrom{border-left-color:var(--marrom)}.kpi.red{border-left-color:var(--red)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:16px}
.tag{display:inline-block;font-size:13px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1.5px solid transparent}
.t-ok{background:var(--verdeBg);color:var(--verde2);border-color:#B8D394}
.t-warn{background:var(--ouroBg);color:#5C3E05;border-color:#E7C982}
.t-bad{background:var(--redBg);color:var(--red);border-color:#F4B4AD}
.t-gray{background:#ECEAE3;color:#3A3A3A;border-color:#CFCBBE}
.t-blue{background:var(--blueBg);color:var(--blue);border-color:#AFCBE8}

/* gráfico */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:220px;padding-top:10px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bar .b{width:100%;max-width:58px;background:var(--verde);border-radius:8px 8px 0 0;min-height:4px}
.bar.hoje .b{background:var(--verde2)}
.bar .val{font-size:13px;font-weight:700;color:var(--verde2);white-space:nowrap}
.bar .d{font-size:14px;font-weight:700;color:var(--tx2)}
.hbar{margin-bottom:12px}
.hbar .top2{display:flex;justify-content:space-between;font-weight:700;font-size:15px;gap:8px}
.hbar .trk{height:14px;background:#ECEAE3;border-radius:99px;overflow:hidden;margin-top:4px}
.hbar .trk i{display:block;height:100%;background:var(--marrom);border-radius:99px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1.5px solid #ECE8DC;font-size:15px}
.list li:last-child{border-bottom:0}

/* tabelas */
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;background:#EFEBDF;color:var(--tx);font-weight:800;padding:11px 12px;white-space:nowrap;border-bottom:2px solid var(--line)}
td{padding:10px 12px;border-bottom:1.5px solid #ECE8DC;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.inativo td{opacity:.55}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--marromBg);display:grid;place-items:center;font-size:20px;flex:none}
.prodcell{display:flex;align-items:center;gap:10px;min-width:220px}
.stk{display:flex;align-items:center;gap:4px;white-space:nowrap}
.stk button{width:32px;height:32px;border-radius:8px;border:2px solid var(--verde2);background:#fff;color:var(--verde2);font-weight:800;cursor:pointer;font-size:17px;line-height:1}
.stk b{min-width:46px;text-align:center}
.stk.low b{color:var(--red)}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}

/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{min-height:42px;padding:7px 14px;border-radius:99px;border:2px solid var(--verde2);background:#fff;color:var(--verde2);font-weight:700;cursor:pointer;font-size:15px}
.seg button.on{background:var(--verde2);color:#fff}

/* kanban */
.kanban{display:grid;align-items:start;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#EFEBDF;border-radius:14px;padding:10px;min-width:0;border:2px solid var(--line)}
.col h3{font-size:16px;display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.col h3 .dot{width:14px;height:14px;border-radius:50%}
.col h3 .n{margin-left:auto;background:#fff;border-radius:99px;padding:0 9px;font-size:14px}
.ped{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;border-left-width:7px}
.ped:hover{border-color:var(--verde2)}
.ped .id{font-weight:800;font-size:16px}
.ped .tot{font-family:Poppins;font-weight:800;color:var(--verde2);font-size:17px}
.ped.novo-flash{animation:flash 1.2s ease 3}
@keyframes flash{50%{background:var(--ouroBg)}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,28,14,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.ov.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;padding:22px;border:2px solid var(--line)}
.modal .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.x{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer;flex:none}
.itens td{padding:8px 6px}
.stbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stbtns button{min-height:44px;border-radius:10px;border:2px solid;background:#fff;font-weight:700;cursor:pointer;font-size:15px}
.stbtns button.on{color:#fff!important}

/* toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 32px)}
.toast{background:var(--verde2);color:#fff;padding:14px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25);max-width:380px;cursor:pointer;border:2px solid #fff}
.toast.ouro{background:#7A4F07}
.empty{padding:26px;text-align:center;color:var(--tx2);font-weight:600}
.note{background:var(--marromBg);border:2px solid #DCC8B2;color:var(--marrom);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600}

/* menu inferior mobile */
.bnav{display:none}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  body.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .hamb{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;border:2px solid var(--verde2);background:#fff;font-size:22px;cursor:pointer;flex:none;color:var(--verde2)}
  .top{padding:10px 16px}
  .top h1{font-size:19px}
  .content{padding:16px 16px 100px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .filters .q{grid-column:1/-1}
  .kanban{grid-template-columns:repeat(6,minmax(250px,82vw))}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);z-index:80;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--tx);font-size:13px;font-weight:700}
  .bnav a .ic{font-size:20px}
  .bnav a.on{background:var(--verde2);color:#fff}
  .selo{display:none}
  .stbtns{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:23px}
}
@media (max-width:860px){ .prodcell{min-width:160px} .prodcell .thumb{display:none} }
@media (max-width:420px){ .g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .kpi{padding:12px} .kpi .v{font-size:20px} }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login">
  <form class="login-box" id="fLogin">
    <img src="../assets/img/logo-perfil.jpg" alt="Logo Manjericão">
    <h1>Painel Manjericão</h1>
    <p class="sub">Produtos Naturais · área do administrador</p>
    <div class="demo-hint">🔑 <b>Demonstração:</b> e-mail e senha já preenchidos. É só clicar em Entrar.</div>
    <label class="f"><span>E-mail</span><input type="email" id="lEmail" required autocomplete="username"></label>
    <label class="f"><span>Senha</span><input type="password" id="lSenha" required autocomplete="current-password"></label>
    <p id="lErro" style="color:var(--red);font-weight:700;display:none;margin:0 0 10px">E-mail ou senha incorretos.</p>
    <button class="btn pri" style="width:100%" type="submit">Entrar no painel</button>
    <p class="muted small" style="text-align:center;margin:14px 0 0"><a href="../index.html">← Voltar para o site</a></p>
  </form>
</section>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand">
        <img src="../assets/img/logo-perfil.jpg" alt="">
        <div><b>Manjericão</b><small>Painel administrativo</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sair"><button class="btn" id="bSair">Sair</button></div>
    </aside>
    <div class="main">
      <header class="top">
        <button class="hamb" id="bHamb" aria-label="Abrir menu">☰</button>
        <h1 id="tTitulo">Visão geral</h1>
        <span class="selo">● Dados de exemplo</span>
        <button class="bell" id="bBell" aria-label="Pedidos novos">🔔<i id="bellN" style="display:none">0</i></button>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>
  <nav class="bnav" id="bnav"></nav>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script src="../shared/data.js?v=20261022180522"></script>
<script>
(function(){
'use strict';
var D = function(){ return MJ.db(); };
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var DIA = 86400000;
var params = new URLSearchParams(location.search);

var TELAS = [
  {id:'geral',     nome:'Visão geral',        ic:'📊', mob:1},
  {id:'pedidos',   nome:'Pedidos',            ic:'🧾', mob:1},
  {id:'produtos',  nome:'Produtos & estoque', ic:'📦', mob:1, curto:'Estoque'},
  {id:'ofertas',   nome:'Ofertas do mês',     ic:'🏷️'},
  {id:'cafe',      nome:'Cafeteria',          ic:'☕'},
  {id:'clientes',  nome:'Clientes',           ic:'👥', mob:1},
  {id:'nutris',    nome:'Nutris parceiras',   ic:'🥗'},
  {id:'vagas',     nome:'Vagas',              ic:'💼'},
  {id:'config',    nome:'Configurações',      ic:'⚙️'}
];
var tela = 'geral';
var filtro = {unidade:'', status:'', q:'', cat:'', un:'', pq:''};
var conhecidos = {};
var naoVistos = 0;

/* ---------------- helpers ---------------- */
function nomeUn(id){ var u = MJ.unidade(id); return u ? u.nome : '—'; }
function dia0(t){ var d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function valido(p){ return p.status !== 'cancelado'; }
function fmtEst(p, v){ return p.tipo==='kg' ? String(Math.round(v*10)/10).replace('.',',')+' kg' : v+' un'; }
function img(p){ return p.img ? '<img class="thumb" src="../'+esc(p.img)+'" alt="">' : '<span class="thumb">'+((MJ.categoria(p.categoria)||{}).icone||'🌿')+'</span>'; }
function stTag(id){ var s = MJ.status(id); return '<span class="tag" style="background:'+s.cor+';color:#fff">'+esc(s.nome)+'</span>'; }
function opts(list, sel, vazio){ return (vazio!=null?'<option value="">'+vazio+'</option>':'') + list.map(function(o){ return '<option value="'+esc(o.id)+'"'+(o.id===sel?' selected':'')+'>'+esc(o.nome)+'</option>'; }).join(''); }
function num(v){ var n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? 0 : n; }
function toast(msg, cls, fn){
  var t = document.createElement('div'); t.className = 'toast '+(cls||''); t.innerHTML = msg;
  t.onclick = function(){ t.remove(); if(fn) fn(); };
  $('#toasts').appendChild(t); setTimeout(function(){ t.remove(); }, 6000);
}
function modal(html){ $('#modal').innerHTML = html; $('#ov').classList.add('open'); }
function fechar(){ $('#ov').classList.remove('open'); }
$('#ov').addEventListener('click', function(e){ if(e.target.id==='ov') fechar(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ fechar(); document.body.classList.remove('menu'); } });

/* ---------------- login ---------------- */
function logado(){ try { return sessionStorage.getItem('mj_admin')==='1'; } catch(e){ return window.__mjLog; } }
function setLog(v){ try { v ? sessionStorage.setItem('mj_admin','1') : sessionStorage.removeItem('mj_admin'); } catch(e){} window.__mjLog = v; }
$('#lEmail').value = D().config.admin.email;
$('#lSenha').value = D().config.admin.senha;
$('#fLogin').addEventListener('submit', function(e){
  e.preventDefault();
  var a = D().config.admin;
  if ($('#lEmail').value.trim().toLowerCase() === a.email && $('#lSenha').value === a.senha){ setLog(true); entrar(); }
  else $('#lErro').style.display = 'block';
});
$('#bSair').onclick = function(){ setLog(false); location.href = location.pathname; };
function entrar(){
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  D().pedidos.forEach(function(p){ conhecidos[p.id] = 1; });
  ir((location.hash||'').slice(1) || 'geral');
}

/* ---------------- navegação ---------------- */
function navHTML(mob){
  var novos = D().pedidos.filter(function(p){ return p.status==='novo'; }).length;
  var nutP = D().nutris.filter(function(n){ return n.status==='pendente'; }).length;
  var vagN = D().candidaturas.filter(function(c){ return c.status==='nova'; }).length;
  var bd = {pedidos:novos, nutris:nutP, vagas:vagN};
  if (mob){
    return TELAS.filter(function(t){ return t.mob; }).map(function(t){
      return '<a href="#'+t.id+'" class="'+(t.id===tela?'on':'')+'"><span class="ic">'+t.ic+'</span>'+(t.curto||t.nome.split(' ')[0])+'</a>';
    }).join('') + '<a href="#" id="bMais"><span class="ic">☰</span>Mais</a>';
  }
  return TELAS.map(function(t){
    return '<a href="#'+t.id+'" class="'+(t.id===tela?'on':'')+'"><span class="ic">'+t.ic+'</span>'+t.nome+(bd[t.id]?'<span class="bdg">'+bd[t.id]+'</span>':'')+'</a>';
  }).join('');
}
function ir(id){
  if (!TELAS.some(function(t){ return t.id===id; })) id = 'geral';
  tela = id; document.body.classList.remove('menu');
  if (location.hash !== '#'+id) history.replaceState(null,'',location.pathname+location.search+'#'+id);
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', function(){ if (logado()) ir(location.hash.slice(1)); });
$('#bHamb').onclick = function(){ document.body.classList.toggle('menu'); };
$('#bBell').onclick = function(){ naoVistos = 0; filtro.status='novo'; ir('pedidos'); };
document.addEventListener('click', function(e){
  if (e.target.closest('#bMais')){ e.preventDefault(); document.body.classList.add('menu'); }
  if (document.body.classList.contains('menu') && !e.target.closest('.side') && !e.target.closest('#bHamb') && !e.target.closest('#bMais')) document.body.classList.remove('menu');
});

function render(){
  $('#nav').innerHTML = navHTML(); $('#bnav').innerHTML = navHTML(true);
  var t = TELAS.filter(function(x){ return x.id===tela; })[0];
  $('#tTitulo').textContent = t.nome;
  var n = $('#bellN'); n.textContent = naoVistos; n.style.display = naoVistos ? 'grid' : 'none';
  $('#view').innerHTML = VIEWS[tela]();
  if (BIND[tela]) BIND[tela]();
}

/* ================= VIEWS ================= */
var VIEWS = {}, BIND = {};

/* ---------- 1. visão geral ---------- */
VIEWS.geral = function(){
  var d = D(), hoje = dia0(Date.now());
  var ok = d.pedidos.filter(valido);
  var pedHoje = ok.filter(function(p){ return dia0(p.criadoEm)===hoje; });
  var fatHoje = pedHoje.reduce(function(s,p){ return s+p.total; },0);
  var sete = ok.filter(function(p){ return dia0(p.criadoEm) > hoje - 7*DIA; });
  var fat7 = sete.reduce(function(s,p){ return s+p.total; },0);
  var ticket = sete.length ? fat7/sete.length : 0;
  var novos = d.pedidos.filter(function(p){ return p.status==='novo'; }).length;

  var dias = []; for (var i=6;i>=0;i--){ var t0 = hoje - i*DIA; dias.push({t:t0, v: ok.filter(function(p){ return dia0(p.criadoEm)===t0; }).reduce(function(s,p){ return s+p.total; },0)}); }
  var max = Math.max.apply(null, dias.map(function(x){ return x.v; }).concat([1]));
  var sem = ['dom','seg','ter','qua','qui','sex','sáb'];
  var bars = dias.map(function(x,i){
    var h = Math.round(x.v/max*100);
    return '<div class="bar'+(i===6?' hoje':'')+'" title="'+MJ.fmt(x.v)+'"><span class="val">'+(x.v?'R$ '+Math.round(x.v):'—')+'</span><div class="b" style="height:'+h+'%"></div><span class="d">'+(i===6?'hoje':sem[new Date(x.t).getDay()])+'</span></div>';
  }).join('');

  var porUn = d.unidades.map(function(u){ return {u:u, v: sete.filter(function(p){ return p.unidadeId===u.id; }).reduce(function(s,p){ return s+p.total; },0), n: sete.filter(function(p){ return p.unidadeId===u.id; }).length}; });
  var maxU = Math.max.apply(null, porUn.map(function(x){ return x.v; }).concat([1]));
  var unHTML = porUn.map(function(x){ return '<div class="hbar"><div class="top2"><span>'+esc(x.u.nome)+'</span><span>'+MJ.fmt(x.v)+' · '+x.n+' ped.</span></div><div class="trk"><i style="width:'+Math.round(x.v/maxU*100)+'%"></i></div></div>'; }).join('');

  var top = {}; sete.forEach(function(p){ p.itens.forEach(function(it){ top[it.produtoId] = top[it.produtoId] || {nome:it.nome, v:0, n:0}; top[it.produtoId].v += it.subtotal; top[it.produtoId].n++; }); });
  var topL = Object.keys(top).map(function(k){ return top[k]; }).sort(function(a,b){ return b.v-a.v; }).slice(0,6);
  var topHTML = topL.length ? '<ul class="list">'+topL.map(function(x,i){ return '<li><span><b>'+(i+1)+'.</b> '+esc(x.nome)+'</span><b>'+MJ.fmt(x.v)+'</b></li>'; }).join('')+'</ul>' : '<div class="empty">Sem vendas ainda.</div>';

  var baixos = [];
  d.produtos.filter(function(p){ return p.ativo; }).forEach(function(p){ d.unidades.forEach(function(u){ var e = MJ.estoqueDe(p,u.id); if (e <= p.estoqueMin) baixos.push({p:p,u:u,e:e}); }); });
  baixos.sort(function(a,b){ return a.e-b.e; });
  var bxHTML = baixos.length ? '<ul class="list">'+baixos.slice(0,8).map(function(x){ return '<li><span><b>'+esc(x.p.nome)+'</b><br><span class="muted">'+esc(x.u.nome)+'</span></span><span class="tag '+(x.e<=0?'t-bad':'t-warn')+'">'+(x.e<=0?'Zerado':fmtEst(x.p,x.e))+'</span></li>'; }).join('')+'</ul>'+(baixos.length>8?'<p class="muted small">+ '+(baixos.length-8)+' itens</p>':'') : '<div class="empty">✅ Nenhum item abaixo do mínimo.</div>';

  var ult = d.pedidos.slice(0,5).map(function(p){ return '<li style="cursor:pointer" data-ped="'+p.id+'"><span><b>'+p.id+'</b> · '+esc(p.cliente.nome)+'<br><span class="muted">'+esc(nomeUn(p.unidadeId))+' · '+MJ.fmtData(p.criadoEm)+'</span></span><span style="text-align:right">'+stTag(p.status)+'<br><b>'+MJ.fmt(p.total)+'</b></span></li>'; }).join('');

  return '<div class="grid g4">'+
    '<div class="kpi"><div class="l">Pedidos hoje</div><div class="v">'+pedHoje.length+'</div><div class="s">sem cancelados</div></div>'+
    '<div class="kpi marrom"><div class="l">Faturamento hoje</div><div class="v">'+MJ.fmt(fatHoje)+'</div><div class="s">7 dias: <b>'+MJ.fmt(fat7)+'</b></div></div>'+
    '<div class="kpi"><div class="l">Ticket médio (7 dias)</div><div class="v">'+MJ.fmt(ticket)+'</div><div class="s">'+sete.length+' pedidos</div></div>'+
    '<div class="kpi '+(novos?'ouro':'')+'" style="cursor:pointer" id="kNovos"><div class="l">Pedidos novos</div><div class="v">'+novos+'</div><div class="s">aguardando separação →</div></div>'+
  '</div>'+
  '<div class="grid g2 mt">'+
    '<div class="card"><div class="row between"><h2>Faturamento · últimos 7 dias</h2><span class="muted small">'+MJ.fmt(fat7)+'</span></div><div class="bars">'+bars+'</div></div>'+
    '<div class="card"><h2>Vendas por unidade (7 dias)</h2>'+unHTML+'<h3 class="mt" style="margin-bottom:6px">Últimos pedidos</h3><ul class="list">'+ult+'</ul></div>'+
  '</div>'+
  '<div class="grid g2 mt">'+
    '<div class="card"><h2>🏆 Mais vendidos (7 dias)</h2>'+topHTML+'</div>'+
    '<div class="card"><div class="row between"><h2>⚠️ Estoque baixo</h2><button class="btn sm" data-go="produtos">Ver estoque</button></div>'+bxHTML+'</div>'+
  '</div>';
};
BIND.geral = function(){
  $('#kNovos').onclick = function(){ filtro.status='novo'; ir('pedidos'); };
  bindComum();
};
function bindComum(){
  document.querySelectorAll('[data-ped]').forEach(function(el){ el.onclick = function(){ abrirPedido(el.getAttribute('data-ped')); }; });
  document.querySelectorAll('[data-go]').forEach(function(el){ el.onclick = function(){ ir(el.getAttribute('data-go')); }; });
}

/* ---------- 2. pedidos ---------- */
VIEWS.pedidos = function(){
  var d = D();
  var L = d.pedidos.filter(function(p){ return (!filtro.unidade || p.unidadeId===filtro.unidade); });
  var segU = '<div class="seg" id="segU"><button data-v="" class="'+(!filtro.unidade?'on':'')+'">Todas as unidades</button>'+d.unidades.map(function(u){ return '<button data-v="'+u.id+'" class="'+(filtro.unidade===u.id?'on':'')+'">'+esc(u.nome)+'</button>'; }).join('')+'</div>';
  var segS = '<div class="seg" id="segS"><button data-v="" class="'+(!filtro.status?'on':'')+'">Todos os status</button>'+MJ.STATUS.map(function(s){ var n = L.filter(function(p){ return p.status===s.id; }).length; return '<button data-v="'+s.id+'" class="'+(filtro.status===s.id?'on':'')+'">'+esc(s.nome)+' ('+n+')</button>'; }).join('')+'</div>';
  var cols = MJ.STATUS.filter(function(s){ return !filtro.status || s.id===filtro.status; });
  var kb = '<div class="kanban" style="'+(cols.length===1?'grid-template-columns:minmax(0,560px)':'')+'">'+cols.map(function(s){
    var ps = L.filter(function(p){ return p.status===s.id; });
    var lim = (s.id==='concluido'||s.id==='cancelado') && !filtro.status ? 8 : 999;
    return '<div class="col"><h3><span class="dot" style="background:'+s.cor+'"></span>'+esc(s.nome)+'<span class="n">'+ps.length+'</span></h3>'+
      (ps.length ? ps.slice(0,lim).map(function(p){ return cardPed(p,s); }).join('') + (ps.length>lim?'<button class="btn sm" style="width:100%" data-st="'+s.id+'">Ver todos ('+ps.length+')</button>':'') : '<div class="empty small">Nenhum</div>')+'</div>';
  }).join('')+'</div>';
  return '<div class="card">'+segU+segS+'<p class="muted small" style="margin:0">Toque em um pedido para ver itens, mudar o status ou chamar o cliente no WhatsApp. Pedidos feitos no site aparecem aqui na hora.</p></div><div class="mt">'+kb+'</div>';
};
function cardPed(p,s){
  return '<div class="ped" data-ped="'+p.id+'" style="border-left-color:'+s.cor+'"><div class="row between"><span class="id">'+p.id+'</span><span class="tot">'+MJ.fmt(p.total)+'</span></div>'+
    '<div style="font-weight:600">'+esc(p.cliente.nome)+'</div>'+
    '<div class="muted small">'+esc(nomeUn(p.unidadeId))+' · '+(p.modalidade==='entrega'?'🛵 Entrega':'🛍️ Retirada')+'</div>'+
    '<div class="muted small">'+MJ.fmtData(p.criadoEm)+' · '+p.itens.length+' ite'+(p.itens.length>1?'ns':'m')+(p.exemplo?'':' · <b style="color:var(--verde2)">site</b>')+'</div></div>';
}
BIND.pedidos = function(){
  document.querySelectorAll('#segU button').forEach(function(b){ b.onclick = function(){ filtro.unidade = b.dataset.v; render(); }; });
  document.querySelectorAll('#segS button').forEach(function(b){ b.onclick = function(){ filtro.status = b.dataset.v; render(); }; });
  document.querySelectorAll('[data-st]').forEach(function(b){ b.onclick = function(){ filtro.status = b.dataset.st; render(); }; });
  bindComum();
};
function abrirPedido(id){
  var p = D().pedidos.filter(function(x){ return x.id===id; })[0]; if (!p) return;
  var u = MJ.unidade(p.unidadeId);
  var pg = MJ.PAGAMENTOS.filter(function(x){ return x.id===p.pagamento; })[0];
  var itens = p.itens.map(function(it){
    var q = it.tipo==='kg' ? (it.qtd>1?it.qtd+'× ':'')+MJ.fmtPeso(it.gramas) : it.qtd+'×';
    return '<tr><td><b>'+q+'</b></td><td>'+esc(it.nome)+'</td><td style="text-align:right;white-space:nowrap">'+MJ.fmt(it.subtotal)+'</td></tr>';
  }).join('');
  var msgCli = 'Olá, '+p.cliente.nome.split(' ')[0]+'! Aqui é da Manjericão '+(u?u.nome:'')+' 🌿 Sobre o seu pedido '+p.id+': ';
  modal('<div class="hd"><div><h2>Pedido '+p.id+'</h2><div class="muted small">'+MJ.fmtData(p.criadoEm)+' · '+esc(u?u.nome:'')+'</div></div><button class="x" onclick="MJP.fechar()">×</button></div>'+
    '<div class="row" style="margin-bottom:12px">'+stTag(p.status)+(p.exemplo?'<span class="tag t-warn">Exemplo</span>':'<span class="tag t-ok">Feito no site</span>')+'</div>'+
    '<div class="grid g2" style="gap:10px;margin-bottom:12px"><div class="note" style="background:#F4F1E8;color:var(--tx);border-color:var(--line)">👤 <b>'+esc(p.cliente.nome)+'</b><br>'+MJ.fmtFone(p.cliente.whatsapp)+'</div>'+
    '<div class="note" style="background:#F4F1E8;color:var(--tx);border-color:var(--line)">'+(p.modalidade==='entrega'?'🛵 <b>Entrega</b><br>'+esc(p.endereco):'🛍️ <b>Retirada na loja</b><br>'+esc(u?u.nome:''))+'<br>💳 '+esc(pg?pg.nome:p.pagamento)+'</div></div>'+
    '<div class="tw"><table class="itens"><tbody>'+itens+
      '<tr><td></td><td>Subtotal</td><td style="text-align:right">'+MJ.fmt(p.subtotal)+'</td></tr>'+
      (p.desconto?'<tr><td></td><td>Desconto ('+esc(p.cupom)+')</td><td style="text-align:right;color:var(--red)">−'+MJ.fmt(p.desconto)+'</td></tr>':'')+
      (p.modalidade==='entrega'?'<tr><td></td><td>Entrega</td><td style="text-align:right">'+(p.taxaEntrega?MJ.fmt(p.taxaEntrega):'grátis')+'</td></tr>':'')+
      '<tr><td></td><td><b>Total</b></td><td style="text-align:right;font-size:18px"><b>'+MJ.fmt(p.total)+'</b></td></tr></tbody></table></div>'+
    (p.obs?'<p class="note mt">📝 '+esc(p.obs)+'</p>':'')+
    '<h3 class="mt" style="margin-bottom:8px">Mudar status</h3><div class="stbtns">'+MJ.STATUS.map(function(s){ var on = s.id===p.status; return '<button class="'+(on?'on':'')+'" style="border-color:'+s.cor+';color:'+s.cor+';'+(on?'background:'+s.cor:'')+'" onclick="MJP.status(\''+p.id+'\',\''+s.id+'\')">'+esc(s.nome)+'</button>'; }).join('')+'</div>'+
    '<div class="row mt"><a class="btn wa" target="_blank" rel="noopener" href="'+MJ.wa(p.cliente.whatsapp, msgCli)+'">💬 Chamar no WhatsApp</a>'+
    '<a class="btn" target="_blank" rel="noopener" href="'+MJ.wa(u?u.whatsapp:'', MJ.mensagemPedido(p))+'">📤 Enviar p/ loja</a></div>');
}

/* ---------- 3. produtos ---------- */
VIEWS.produtos = function(){
  var d = D(), q = filtro.pq.toLowerCase();
  var L = d.produtos.filter(function(p){
    if (filtro.cat && p.categoria!==filtro.cat) return false;
    if (q && (p.nome+' '+(p.marca||'')).toLowerCase().indexOf(q)<0) return false;
    if (filtro.un==='baixo') return MJ.estoqueBaixo(p);
    return true;
  });
  var uns = filtro.un && filtro.un!=='baixo' ? d.unidades.filter(function(u){ return u.id===filtro.un; }) : d.unidades;
  var rows = L.map(function(p){
    var cat = MJ.categoria(p.categoria)||{nome:p.categoria};
    var est = uns.map(function(u){ var e = MJ.estoqueDe(p,u.id); var low = e<=p.estoqueMin;
      return '<td><div class="stk'+(low?' low':'')+'"><button data-adj="'+p.id+'|'+u.id+'|-1" aria-label="Diminuir">−</button><b>'+fmtEst(p,e)+'</b><button data-adj="'+p.id+'|'+u.id+'|1" aria-label="Aumentar">+</button></div></td>'; }).join('');
    return '<tr class="'+(p.ativo?'':'inativo')+'"><td><div class="prodcell">'+img(p)+'<div><b>'+esc(p.nome)+'</b><div class="muted small">'+esc(cat.nome)+(p.marca?' · '+esc(p.marca):'')+(p.destaque?' · ⭐':'')+(p.ativo?'':' · <b>inativo</b>')+'</div></div></div></td>'+
      '<td style="white-space:nowrap">'+(MJ.emOferta(p)?'<s class="muted">'+MJ.fmt(p.preco)+'</s><br><b style="color:var(--red)">'+MJ.fmt(p.promo)+'</b>':'<b>'+MJ.fmt(p.preco)+'</b>')+'<span class="muted small">/'+(p.tipo==='kg'?'kg':'un')+'</span></td>'+est+
      '<td><button class="btn sm" data-edit="'+p.id+'">Editar</button></td></tr>';
  }).join('');
  return '<div class="filters"><input class="q" type="search" id="pq" placeholder="🔎 Buscar produto ou marca…" value="'+esc(filtro.pq)+'">'+
    '<select id="pcat">'+opts(MJ.CATEGORIAS, filtro.cat, 'Todas as categorias')+'</select>'+
    '<select id="pun"><option value="">Todas as unidades</option>'+d.unidades.map(function(u){ return '<option value="'+u.id+'"'+(filtro.un===u.id?' selected':'')+'>'+esc(u.nome)+'</option>'; }).join('')+'<option value="baixo"'+(filtro.un==='baixo'?' selected':'')+'>⚠️ Só estoque baixo</option></select>'+
    '<button class="btn pri" id="bNovo">+ Novo produto</button></div>'+
    '<p class="muted small" style="margin:0 0 10px">'+L.length+' produtos · use − / + para ajuste rápido (1 un ou 0,5 kg). Vermelho = abaixo do mínimo.</p>'+
    '<div class="tw"><table><thead><tr><th>Produto</th><th>Preço</th>'+uns.map(function(u){ return '<th>'+esc(u.nome)+'</th>'; }).join('')+'<th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="9"><div class="empty">Nenhum produto encontrado.</div></td></tr>')+'</tbody></table></div>';
};
BIND.produtos = function(){
  var pq = $('#pq');
  pq.oninput = function(){ filtro.pq = pq.value; var pos = pq.selectionStart; render(); var n = $('#pq'); n.focus(); n.setSelectionRange(pos,pos); };
  $('#pcat').onchange = function(){ filtro.cat = this.value; render(); };
  $('#pun').onchange = function(){ filtro.un = this.value; render(); };
  $('#bNovo').onclick = function(){ editarProduto(null); };
  document.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick = function(){ editarProduto(b.dataset.edit); }; });
  document.querySelectorAll('[data-adj]').forEach(function(b){ b.onclick = function(){
    var a = b.dataset.adj.split('|'), d = D(), p = d.produtos.filter(function(x){ return x.id===a[0]; })[0];
    var passo = p.tipo==='kg' ? 0.5 : 1;
    p.estoque[a[1]] = Math.max(0, Math.round((MJ.estoqueDe(p,a[1]) + passo*Number(a[2]))*10)/10);
    MJ.save(d);
  }; });
};
function editarProduto(id){
  var d = D(), p = id ? d.produtos.filter(function(x){ return x.id===id; })[0] : {id:'', nome:'', marca:'', categoria:'granel', tipo:'un', preco:'', promo:null, estoque:{}, ativo:true, destaque:false, estoqueMin:4, desc:''};
  modal('<div class="hd"><h2>'+(id?'Editar produto':'Novo produto')+'</h2><button class="x" onclick="MJP.fechar()">×</button></div>'+
    '<form id="fProd">'+(p.img?'<div class="row" style="margin-bottom:12px">'+img(p)+'<span class="muted small">Foto do produto</span></div>':'')+
    '<label class="f"><span>Nome</span><input type="text" name="nome" required value="'+esc(p.nome)+'"></label>'+
    '<div class="grid g2" style="gap:12px"><label class="f"><span>Marca</span><input type="text" name="marca" value="'+esc(p.marca)+'"></label>'+
    '<label class="f"><span>Categoria</span><select name="categoria">'+opts(MJ.CATEGORIAS,p.categoria)+'</select></label></div>'+
    '<div class="grid g3" style="gap:12px"><label class="f"><span>Vendido por</span><select name="tipo"><option value="un"'+(p.tipo==='un'?' selected':'')+'>Unidade</option><option value="kg"'+(p.tipo==='kg'?' selected':'')+'>Quilo (granel)</option></select></label>'+
    '<label class="f"><span>Preço (R$)</span><input type="number" step="0.01" min="0" name="preco" required value="'+esc(p.preco)+'"></label>'+
    '<label class="f"><span>Preço promo (R$)</span><input type="number" step="0.01" min="0" name="promo" placeholder="sem promoção" value="'+(p.promo!=null?esc(p.promo):'')+'"></label></div>'+
    '<h3 style="margin:4px 0 8px">Estoque por unidade</h3><div class="grid g3" style="gap:12px">'+d.unidades.map(function(u){ return '<label class="f"><span>'+esc(u.nome)+'</span><input type="number" step="0.1" min="0" name="est_'+u.id+'" value="'+MJ.estoqueDe(p,u.id)+'"></label>'; }).join('')+'</div>'+
    '<label class="f"><span>Estoque mínimo (alerta)</span><input type="number" step="0.1" min="0" name="estoqueMin" value="'+esc(p.estoqueMin)+'"></label>'+
    '<div class="row" style="gap:24px;margin-bottom:14px"><label class="chk"><input type="checkbox" name="ativo"'+(p.ativo?' checked':'')+'> Ativo no site</label><label class="chk"><input type="checkbox" name="destaque"'+(p.destaque?' checked':'')+'> ⭐ Destaque</label></div>'+
    '<div class="row between"><button type="button" class="btn" onclick="MJP.fechar()">Cancelar</button><button class="btn pri" type="submit">Salvar produto</button></div></form>');
  $('#fProd').onsubmit = function(e){
    e.preventDefault(); var f = e.target, d2 = D();
    var alvo = id ? d2.produtos.filter(function(x){ return x.id===id; })[0] : null;
    if (!alvo){ alvo = {id: MJ.uid('prod'), promo:null, medida:'', desc:'', tags:[], img:null, real:false, exemplo:false, estoque:{}}; d2.produtos.unshift(alvo); }
    alvo.nome = f.nome.value.trim(); alvo.marca = f.marca.value.trim(); alvo.categoria = f.categoria.value; alvo.tipo = f.tipo.value;
    alvo.preco = num(f.preco.value); var pr = num(f.promo.value); alvo.promo = pr>0 ? pr : null;
    d2.unidades.forEach(function(u){ alvo.estoque[u.id] = Math.max(0, num(f['est_'+u.id].value)); });
    alvo.estoqueMin = num(f.estoqueMin.value); alvo.ativo = f.ativo.checked; alvo.destaque = f.destaque.checked;
    MJ.save(d2); fechar(); toast('✅ Produto salvo: '+esc(alvo.nome));
  };
}

/* ---------- 4. ofertas ---------- */
VIEWS.ofertas = function(){
  var d = D(), c = d.campanha || {};
  var emOf = d.produtos.filter(MJ.emOferta);
  var rows = d.produtos.filter(function(p){ return p.ativo; }).sort(function(a,b){ return (MJ.emOferta(b)?1:0)-(MJ.emOferta(a)?1:0); }).map(function(p){
    var pct = MJ.emOferta(p) ? Math.round((1-p.promo/p.preco)*100) : 0;
    return '<tr><td><div class="prodcell">'+img(p)+'<b>'+esc(p.nome)+'</b></div></td><td style="white-space:nowrap">'+MJ.fmt(p.preco)+'<span class="muted small">/'+p.tipo+'</span></td>'+
      '<td style="min-width:150px"><input type="number" step="0.01" min="0" data-promo="'+p.id+'" value="'+(p.promo!=null?p.promo:'')+'" placeholder="—"></td>'+
      '<td>'+(pct?'<span class="tag t-bad">−'+pct+'%</span>':'<span class="muted">—</span>')+'</td></tr>';
  }).join('');
  return '<div class="grid g2"><div class="card"><h2>Campanha do mês</h2><form id="fCamp">'+
    '<label class="chk" style="margin-bottom:10px"><input type="checkbox" name="ativa"'+(c.ativa?' checked':'')+'> Mostrar faixa de ofertas no site</label>'+
    '<label class="f"><span>Título</span><input type="text" name="titulo" value="'+esc(c.titulo)+'"></label>'+
    '<label class="f"><span>Subtítulo</span><input type="text" name="subtitulo" value="'+esc(c.subtitulo)+'"></label>'+
    '<label class="f"><span>Válida até</span><input type="date" name="validade" value="'+esc(c.validade)+'"></label>'+
    '<button class="btn pri" type="submit">Salvar campanha</button></form></div>'+
    '<div class="card"><h2>Resumo</h2><div class="kpi ouro"><div class="l">Produtos em oferta</div><div class="v">'+emOf.length+'</div><div class="s">'+esc(c.titulo||'')+(c.validade?' · até '+c.validade.split('-').reverse().join('/'):'')+'</div></div>'+
    '<p class="note mt">Digite o preço promocional ao lado de cada produto. Deixe em branco para tirar da oferta. Salva automaticamente e já aparece no site.</p></div></div>'+
    '<div class="card mt"><h2>Preço promocional por produto</h2><div class="tw"><table><thead><tr><th>Produto</th><th>Preço normal</th><th>Preço promo (R$)</th><th>Desconto</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
};
BIND.ofertas = function(){
  $('#fCamp').onsubmit = function(e){ e.preventDefault(); var f = e.target, d = D();
    d.campanha = {ativa:f.ativa.checked, titulo:f.titulo.value.trim(), subtitulo:f.subtitulo.value.trim(), validade:f.validade.value};
    MJ.save(d); toast('✅ Campanha salva'); };
  document.querySelectorAll('[data-promo]').forEach(function(inp){ inp.onchange = function(){
    var d = D(), p = d.produtos.filter(function(x){ return x.id===inp.dataset.promo; })[0], v = num(inp.value);
    if (v && v >= p.preco){ toast('⚠️ O preço promo precisa ser menor que '+MJ.fmt(p.preco),'ouro'); inp.value = p.promo!=null?p.promo:''; return; }
    p.promo = v>0 ? v : null; MJ.save(d); toast('✅ '+esc(p.nome)+(p.promo?' por '+MJ.fmt(p.promo):' saiu da oferta'));
  }; });
};

/* ---------- 5. cafeteria ---------- */
VIEWS.cafe = function(){
  var d = D();
  var uc = d.unidades.filter(function(u){ return u.cafeteria; }).map(function(u){ return u.nome; }).join(' e ');
  return '<p class="note" style="margin:0 0 16px">☕ Cardápio da cafeteria ('+esc(uc)+'). Altere preço e disponibilidade — salva sozinho.</p>'+
  MJ.CARDAPIO_CATS.map(function(cat){
    var its = d.cardapio.filter(function(c){ return c.categoria===cat.id; });
    return '<div class="card"><h2>'+esc(cat.nome)+'</h2><div class="tw"><table><thead><tr><th>Item</th><th>Preço (R$)</th><th>Disponível</th><th>Destaque</th></tr></thead><tbody>'+
      its.map(function(c){ return '<tr class="'+(c.ativo?'':'inativo')+'"><td><b>'+esc(c.nome)+'</b><div class="muted small">'+esc(c.desc)+'</div></td>'+
        '<td style="width:150px"><input type="number" step="0.5" min="0" data-cp="'+c.id+'" value="'+c.preco+'"></td>'+
        '<td><label class="chk"><input type="checkbox" data-ca="'+c.id+'"'+(c.ativo?' checked':'')+'> '+(c.ativo?'Sim':'Não')+'</label></td>'+
        '<td><label class="chk"><input type="checkbox" data-cd="'+c.id+'"'+(c.destaque?' checked':'')+'> ⭐</label></td></tr>'; }).join('')+
      '</tbody></table></div></div>';
  }).join('');
};
BIND.cafe = function(){
  function item(id){ var d = D(); return [d, d.cardapio.filter(function(c){ return c.id===id; })[0]]; }
  document.querySelectorAll('[data-cp]').forEach(function(i){ i.onchange = function(){ var r = item(i.dataset.cp); r[1].preco = num(i.value); MJ.save(r[0]); toast('✅ '+esc(r[1].nome)+': '+MJ.fmt(r[1].preco)); }; });
  document.querySelectorAll('[data-ca]').forEach(function(i){ i.onchange = function(){ var r = item(i.dataset.ca); r[1].ativo = i.checked; MJ.save(r[0]); }; });
  document.querySelectorAll('[data-cd]').forEach(function(i){ i.onchange = function(){ var r = item(i.dataset.cd); r[1].destaque = i.checked; MJ.save(r[0]); }; });
};

/* ---------- 6. clientes ---------- */
VIEWS.clientes = function(){
  var d = D(), q = filtro.q.toLowerCase();
  var L = d.clientes.map(function(c){
    var ps = d.pedidos.filter(function(p){ return p.clienteId===c.id && valido(p); });
    return {c:c, n:ps.length, tot:ps.reduce(function(s,p){ return s+p.total; },0), ult: ps.length ? ps.map(function(p){ return p.criadoEm; }).sort().pop() : null};
  }).filter(function(x){ return !q || (x.c.nome+' '+x.c.whatsapp+' '+(x.c.bairro||'')).toLowerCase().indexOf(q)>=0; })
    .sort(function(a,b){ return b.tot-a.tot; });
  var aceitam = d.clientes.filter(function(c){ return c.aceitaOfertas; }).length;
  var rows = L.map(function(x){ var c = x.c;
    return '<tr><td><b>'+esc(c.nome)+'</b><div class="muted small">'+MJ.fmtFone(c.whatsapp)+(c.bairro?' · '+esc(c.bairro):'')+'</div></td>'+
      '<td>'+esc(nomeUn(c.unidadeId))+'</td><td style="text-align:center"><b>'+x.n+'</b></td><td style="white-space:nowrap"><b>'+MJ.fmt(x.tot)+'</b></td>'+
      '<td style="white-space:nowrap">'+(x.ult?MJ.fmtData(x.ult):'—')+'</td>'+
      '<td>'+(c.aceitaOfertas?'<span class="tag t-ok">Sim</span>':'<span class="tag t-gray">Não</span>')+(c.origem==='clube'?' <span class="tag t-blue">Clube</span>':'')+'</td>'+
      '<td><a class="btn wa sm" target="_blank" rel="noopener" href="'+MJ.wa(c.whatsapp,'Olá, '+c.nome.split(' ')[0]+'! Aqui é da Manjericão Produtos Naturais 🌿 ')+'">💬 WhatsApp</a></td></tr>';
  }).join('');
  return '<div class="grid g3"><div class="kpi"><div class="l">Clientes</div><div class="v">'+d.clientes.length+'</div></div>'+
    '<div class="kpi ouro"><div class="l">Aceitam ofertas</div><div class="v">'+aceitam+'</div><div class="s">podem receber promoções no WhatsApp</div></div>'+
    '<div class="kpi marrom"><div class="l">Compraram 2+ vezes</div><div class="v">'+L.filter(function(x){ return x.n>1; }).length+'</div></div></div>'+
    '<div class="mt" style="margin-bottom:12px"><input type="search" id="cq" placeholder="🔎 Buscar por nome, telefone ou bairro…" value="'+esc(filtro.q)+'"></div>'+
    '<div class="tw"><table><thead><tr><th>Cliente</th><th>Unidade</th><th>Pedidos</th><th>Total gasto</th><th>Última compra</th><th>Aceita ofertas</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="7"><div class="empty">Nenhum cliente.</div></td></tr>')+'</tbody></table></div>';
};
BIND.clientes = function(){ var i = $('#cq'); i.oninput = function(){ filtro.q = i.value; var pos = i.selectionStart; render(); var n = $('#cq'); n.focus(); n.setSelectionRange(pos,pos); }; };

/* ---------- 7. nutris ---------- */
VIEWS.nutris = function(){
  var d = D();
  var cards = d.nutris.map(function(n){
    var ps = d.pedidos.filter(function(p){ return (p.nutriId===n.id || (p.cupom && p.cupom===n.cupom)) && valido(p); });
    var tot = ps.reduce(function(s,p){ return s+p.total; },0);
    var st = n.status==='ativa' ? '<span class="tag t-ok">Ativa</span>' : n.status==='pendente' ? '<span class="tag t-warn">Aguardando aprovação</span>' : '<span class="tag t-gray">Desativada</span>';
    return '<div class="card" style="margin:0"><div class="row between"><h3>'+esc(n.nome)+'</h3>'+st+'</div>'+
      '<div class="muted small" style="margin:4px 0 12px">'+esc(n.crn||'')+(n.instagram?' · '+esc(n.instagram):'')+' · '+MJ.fmtFone(n.whatsapp)+'</div>'+
      '<div class="grid g2" style="gap:10px;margin-bottom:12px"><div class="kpi" style="padding:10px"><div class="l">Pedidos</div><div class="v" style="font-size:19px;white-space:nowrap">'+ps.length+'</div></div><div class="kpi marrom" style="padding:10px"><div class="l">Vendido</div><div class="v" style="font-size:19px;white-space:nowrap">'+MJ.fmt(tot)+'</div></div></div>'+
      '<div class="grid g2" style="gap:10px"><label class="f"><span>Cupom</span><input type="text" data-ncup="'+n.id+'" value="'+esc(n.cupom)+'" style="text-transform:uppercase;font-weight:800"></label>'+
      '<label class="f"><span>Desconto (%)</span><input type="number" min="0" max="50" data-ndesc="'+n.id+'" value="'+n.desconto+'"></label></div>'+
      '<div class="row">'+(n.status!=='ativa'?'<button class="btn pri sm" data-nst="'+n.id+'|ativa">✓ '+(n.status==='pendente'?'Aprovar':'Reativar')+'</button>':'<button class="btn danger sm" data-nst="'+n.id+'|inativa">Desativar</button>')+
      '<a class="btn wa sm" target="_blank" rel="noopener" href="'+MJ.wa(n.whatsapp,'Olá, '+n.nome.split(' ')[0]+'! Aqui é da Manjericão 🌿 Seu cupom '+n.cupom+' dá '+n.desconto+'% de desconto para seus pacientes.')+'">💬 WhatsApp</a></div></div>';
  }).join('');
  return '<p class="note" style="margin:0 0 16px">🥗 Nutricionistas se cadastram pelo site. Aprove, defina o cupom e acompanhe quanto cada uma trouxe de venda.</p><div class="grid g3">'+(cards||'<div class="empty">Nenhuma nutri cadastrada.</div>')+'</div>';
};
BIND.nutris = function(){
  function nt(id){ var d = D(); return [d, d.nutris.filter(function(n){ return n.id===id; })[0]]; }
  document.querySelectorAll('[data-nst]').forEach(function(b){ b.onclick = function(){ var a = b.dataset.nst.split('|'), r = nt(a[0]); r[1].status = a[1]; MJ.save(r[0]); toast(a[1]==='ativa'?'✅ Nutri ativa — cupom liberado':'Nutri desativada'); }; });
  document.querySelectorAll('[data-ncup]').forEach(function(i){ i.onchange = function(){ var r = nt(i.dataset.ncup), v = i.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if (!v || r[0].nutris.some(function(n){ return n.cupom===v && n.id!==r[1].id; })){ toast('⚠️ Cupom vazio ou já usado','ouro'); render(); return; }
    r[1].cupom = v; MJ.save(r[0]); toast('✅ Cupom: '+v); }; });
  document.querySelectorAll('[data-ndesc]').forEach(function(i){ i.onchange = function(){ var r = nt(i.dataset.ndesc); r[1].desconto = Math.min(50, Math.max(0, Math.round(num(i.value)))); MJ.save(r[0]); toast('✅ Desconto: '+r[1].desconto+'%'); }; });
};

/* ---------- 8. vagas ---------- */
var CAND_ST = [{id:'nova',nome:'Nova',c:'t-warn'},{id:'entrevista',nome:'Entrevista',c:'t-blue'},{id:'contratada',nome:'Contratada',c:'t-ok'},{id:'recusada',nome:'Não seguiu',c:'t-gray'}];
VIEWS.vagas = function(){
  var d = D();
  var cards = d.candidaturas.map(function(c){
    var st = CAND_ST.filter(function(s){ return s.id===c.status; })[0] || {nome:c.status,c:'t-gray'};
    return '<div class="card" style="margin:0"><div class="row between"><h3>'+esc(c.nome)+'</h3><span class="tag '+st.c+'">'+esc(st.nome)+'</span></div>'+
      '<div style="font-weight:700;margin-top:4px">'+esc(c.vaga)+' · '+esc(nomeUn(c.unidadeId))+'</div>'+
      '<div class="muted small">'+MJ.fmtFone(c.whatsapp)+(c.email?' · '+esc(c.email):'')+' · '+(c.criadoEm?MJ.fmtData(c.criadoEm):'')+'</div>'+
      (c.mensagem?'<p style="margin:10px 0;background:#F4F1E8;border-radius:10px;padding:10px;font-size:15px">“'+esc(c.mensagem)+'”</p>':'')+
      '<label class="f" style="margin-top:8px"><span>Status</span><select data-cst="'+c.id+'">'+opts(CAND_ST,c.status)+'</select></label>'+
      '<a class="btn wa sm" target="_blank" rel="noopener" href="'+MJ.wa(c.whatsapp,'Olá, '+c.nome.split(' ')[0]+'! Aqui é da Manjericão Produtos Naturais 🌿 Recebemos sua candidatura para '+c.vaga+'.')+'">💬 Chamar no WhatsApp</a></div>';
  }).join('');
  return '<div class="grid g3">'+(cards||'<div class="empty">Nenhuma candidatura ainda.</div>')+'</div>';
};
BIND.vagas = function(){
  document.querySelectorAll('[data-cst]').forEach(function(s){ s.onchange = function(){ var d = D(), c = d.candidaturas.filter(function(x){ return x.id===s.dataset.cst; })[0]; c.status = s.value; MJ.save(d); toast('✅ Status atualizado'); }; });
};

/* ---------- 9. config ---------- */
VIEWS.config = function(){
  var d = D(), e = d.config.entrega;
  return '<div class="grid g3">'+d.unidades.map(function(u){
    return '<div class="card" style="margin:0"><h2>'+esc(u.nome)+'</h2><form data-fu="'+u.id+'">'+
      '<label class="f"><span>Endereço</span><input type="text" name="endereco" value="'+esc(u.endereco)+'"></label>'+
      '<label class="f"><span>WhatsApp</span><input type="text" name="whatsapp" value="'+esc(MJ.fmtFone(u.whatsapp))+'"></label>'+
      '<label class="f"><span>Horário</span><input type="text" name="horario" value="'+esc(u.horario)+'"></label>'+
      '<label class="chk" style="margin-bottom:10px"><input type="checkbox" name="cafeteria"'+(u.cafeteria?' checked':'')+'> Tem cafeteria</label>'+
      '<button class="btn pri" type="submit">Salvar unidade</button></form></div>';
  }).join('')+'</div>'+
  '<div class="grid g2 mt"><div class="card" style="margin:0"><h2>🛵 Entrega</h2><form id="fEnt">'+
    '<label class="chk" style="margin-bottom:10px"><input type="checkbox" name="ativa"'+(e.ativa?' checked':'')+'> Oferecer entrega no site</label>'+
    '<div class="grid g2" style="gap:12px"><label class="f"><span>Taxa de entrega (R$)</span><input type="number" step="0.01" min="0" name="taxa" value="'+e.taxa+'"></label>'+
    '<label class="f"><span>Grátis acima de (R$)</span><input type="number" step="0.01" min="0" name="gratis" value="'+e.gratisAcima+'"></label></div>'+
    '<label class="f"><span>Observação</span><input type="text" name="obs" value="'+esc(e.obs)+'"></label>'+
    '<button class="btn pri" type="submit">Salvar entrega</button></form></div>'+
  '<div class="card" style="margin:0"><h2>🧪 Dados de demonstração</h2><p class="muted" style="margin-top:0">Os pedidos, clientes, nutris e candidaturas atuais são <b>exemplos</b> para mostrar como o painel funciona.</p>'+
    '<div class="row"><button class="btn" id="bReset">↺ Restaurar dados de demonstração</button><button class="btn danger" id="bLimpar">🗑 Apagar dados de exemplo</button></div>'+
    '<p class="muted small">“Apagar” mantém produtos, cardápio e unidades e remove só os registros de exemplo — a loja começa do zero.</p></div></div>';
};
BIND.config = function(){
  document.querySelectorAll('[data-fu]').forEach(function(f){ f.onsubmit = function(ev){ ev.preventDefault(); var d = D(), u = d.unidades.filter(function(x){ return x.id===f.dataset.fu; })[0];
    u.endereco = f.endereco.value.trim(); var w = MJ.soDigitos(f.whatsapp.value); if (w && w.indexOf('55')!==0) w = '55'+w; u.whatsapp = w; u.horario = f.horario.value.trim(); u.cafeteria = f.cafeteria.checked;
    MJ.save(d); toast('✅ '+esc(u.nome)+' salva'); }; });
  $('#fEnt').onsubmit = function(ev){ ev.preventDefault(); var f = ev.target, d = D();
    d.config.entrega.ativa = f.ativa.checked; d.config.entrega.taxa = num(f.taxa.value); d.config.entrega.gratisAcima = num(f.gratis.value); d.config.entrega.obs = f.obs.value.trim();
    MJ.save(d); toast('✅ Entrega salva'); };
  $('#bReset').onclick = function(){ if (confirm('Restaurar todos os dados de demonstração? Alterações feitas serão perdidas.')){ MJ.reset(); conhecidos = {}; D().pedidos.forEach(function(p){ conhecidos[p.id]=1; }); naoVistos = 0; toast('↺ Dados de demonstração restaurados'); render(); } };
  $('#bLimpar').onclick = function(){ if (confirm('Apagar pedidos, clientes, nutris e candidaturas de exemplo?')){ MJ.limparExemplos(); toast('🗑 Dados de exemplo apagados'); render(); } };
};

/* ---------------- ao vivo ---------------- */
MJ.on(function(){
  if (!logado() && !params.has('demo')) return;
  var novos = D().pedidos.filter(function(p){ return !conhecidos[p.id]; });
  novos.forEach(function(p){
    conhecidos[p.id] = 1; naoVistos++;
    toast('🔔 Novo pedido '+p.id+' · '+esc(p.cliente.nome)+' · '+MJ.fmt(p.total)+'<br><span style="font-weight:500">'+esc(nomeUn(p.unidadeId))+' — toque para abrir</span>','ouro', function(){ abrirPedido(p.id); });
  });
  if (novos.length) bip();
  var ae = document.activeElement, keep = ae && ae.tagName==='INPUT' && ae.type!=='checkbox' && $('#view').contains(ae);
  if (!keep) render(); else { $('#nav').innerHTML = navHTML(); $('#bnav').innerHTML = navHTML(true); var n = $('#bellN'); n.textContent = naoVistos; n.style.display = naoVistos?'grid':'none'; }
  if ($('#ov').classList.contains('open') && $('#modal h2') && /^Pedido /.test($('#modal h2').textContent)) abrirPedido($('#modal h2').textContent.replace('Pedido ',''));
  if (novos.length) setTimeout(function(){ novos.forEach(function(p){ var el = document.querySelector('.ped[data-ped="'+p.id+'"]'); if (el) el.classList.add('novo-flash'); }); }, 50);
});
function bip(){ try { var a = new (window.AudioContext||window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.4); o.start(); o.stop(a.currentTime+.4); } catch(e){} }

window.MJP = {
  fechar: fechar,
  status: function(id, st){ MJ.mudarStatus(id, st); toast('Pedido '+id+' → '+esc(MJ.status(st).nome)); abrirPedido(id); }
};

if (params.has('demo')) setLog(true);
if (logado()) entrar();
})();
</script>
